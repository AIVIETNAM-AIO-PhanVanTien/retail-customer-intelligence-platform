version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Pin container paths so a stray AIRFLOW_HOME/DAGS_FOLDER in .env (host-relative)
    # cannot break DAG discovery. environment: overrides env_file:, so this always wins.
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - ./ml:/opt/airflow/ml
    - ./src:/opt/airflow/src
    - ./requirements.txt:/opt/airflow/requirements.txt
    - ./scripts:/opt/airflow/scripts
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ─── Postgres (Airflow metadata DB) ───────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # ─── Airflow init (runs once: creates DB + admin user) ────────────────────
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username admin
      --firstname admin
      --lastname admin
      --role Admin
      --email admin@example.com
      --password admin"

  # ─── Airflow webserver (UI) ───────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Airflow scheduler (runs the DAGs) ───────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ─── MLflow tracking server ───────────────────────────────────────────────
  # Note: using SQLite backend — sufficient for a single-node setup.
  # Upgrade to postgres backend if you need concurrent writers or horizontal scale.
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
      - ./models:/mlflow/models
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/mlruns

  # ─── Streamlit dashboard (ACM1-75) ────────────────────────────────────────
  # Production-ready: restart policy, ml/ + app/ volumes mounted.
  # Requires Dockerfile.streamlit at repo root.
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      # Gold data — churn scores, RFM mart, fact tables
      - ./data:/app/data:ro
      # ML artifacts — model.pkl, metadata.json, SHAP outputs (ACM1-76 drift tab)
      - ./ml:/app/ml:ro
      # Serving layer — customers.parquet + model copy exported by publish_scores
      - ./app:/app/app:ro
      # Dashboard source — pages/, components/, monitoring tab (ACM1-76)
      - ./dashboard:/app/dashboard
    depends_on:
      - mlflow
    restart: unless-stopped

volumes:
  postgres_data: