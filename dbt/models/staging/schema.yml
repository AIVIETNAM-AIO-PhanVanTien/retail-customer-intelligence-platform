version: 2
models:
  - name: stg_silver__transactions
    description: "Cleaned transactions from Silver layer parquet files, deduplicated and filtered for noise"
    description: "1:1 mirror of validated Silver Parquet (Python silver_transform output)"
    columns:
      - name: invoice
        tests:
          - not_null
      - name: stock_code
        tests:
          - not_null
      - name: customer_id
        description: "Empty string for guest / unknown customers"
      - name: quantity
        tests:
          - not_null
      - name: price
        tests:
          - not_null
      - name: line_amount
        tests:
          - not_null
      - name: is_cancellation
        tests:
          - not_null
      - name: invoice_date
        tests:
          - not_null
      - name: country
        description: "Customer's country"
        
        tests:
          - not_null
      - name: year_month
        tests:
          - not_null
