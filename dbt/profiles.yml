retail_duckdb:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative path — works when running dbt locally from the dbt/ directory
      path: '../data/retail.duckdb'
    prod:
      type: duckdb
      # Absolute path — used by Airflow container (mounted at /opt/airflow/data/)
      path: '/opt/airflow/data/retail.duckdb'
