name: 'retail_medallion'
version: '1.0.0'

profile: 'retail_duckdb'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Default: relative paths for local dbt runs (from the dbt/ directory).
  # Override in Airflow with --vars 'silver_dir: /opt/airflow/data/silver bronze_dir: /opt/airflow/data/bronze'
  silver_dir: '../data/silver'
  bronze_dir: '../data/bronze'

models:
  retail_medallion:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
